<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gold Empire Clicker</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    text-align:center;
}

h1{
    color:gold;
    text-shadow:0 0 15px gold;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.panel{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:15px;
    margin:10px;
    box-shadow:0 0 20px rgba(255,215,0,.15);
}

.stats{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.card{
    min-width:180px;
}

button{
    border:none;
    padding:12px;
    margin:5px;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

.mine{
    width:180px;
    height:180px;
    border-radius:50%;
    font-size:24px;
    background:linear-gradient(gold,orange);
    color:black;
    box-shadow:0 0 25px gold;
}

.shopBtn{
    width:250px;
    background:linear-gradient(45deg,#2563eb,#60a5fa);
}

.rebirth{
    background:linear-gradient(45deg,#9333ea,#ec4899);
}

.achievement{
    color:lime;
    margin:5px;
}

.floatText{
    position:absolute;
    color:gold;
    font-weight:bold;
    pointer-events:none;
    animation:float 1s linear forwards;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-80px);
        opacity:0;
    }
}

#goldenNugget{
    display:none;
    position:fixed;
    font-size:50px;
    cursor:pointer;
    z-index:999;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.2);}
}
</style>
</head>

<body>

<div class="container">

<h1>⛏️ Gold Empire Clicker ⛏️</h1>

<div class="panel">
<h2>Gold: <span id="gold">0</span></h2>
<h3>GPS: <span id="gps">0</span></h3>

<button class="mine" onclick="mine(event)">
💰
</button>
</div>

<div class="stats">

<div class="panel card">
<h3>Click Power</h3>
<span id="clickPower">1</span>
</div>

<div class="panel card">
<h3>Prestige</h3>
<span id="prestigeLevel">0</span>
</div>

<div class="panel card">
<h3>Total Gold</h3>
<span id="totalGold">0</span>
</div>

</div>

<div class="panel">
<h2>🏪 Shop</h2>

<button class="shopBtn" onclick="buyMiner()">
Miner (+1 GPS)
<br>
Cost: <span id="minerCost">15</span>
</button>

<br>

<button class="shopBtn" onclick="buyFactory()">
Factory (+10 GPS)
<br>
Cost: <span id="factoryCost">100</span>
</button>

<br>

<button class="shopBtn" onclick="upgradePickaxe()">
Upgrade Pickaxe
<br>
Cost: <span id="upgradeCost">25</span>
</button>

</div>

<div class="panel">
<h2>⭐ Prestige</h2>

<button class="rebirth" onclick="rebirth()">
Rebirth at 100,000 Gold
</button>

<p>
Each Prestige = +25% Gold Bonus
</p>

</div>

<div class="panel">
<h2>🏆 Achievements</h2>
<div id="achievements"></div>
</div>

</div>

<div id="goldenNugget">🌟</div>

<script>

let gold = Number(localStorage.gold)||0;
let totalGold = Number(localStorage.totalGold)||0;
let clickPower = Number(localStorage.clickPower)||1;
let prestige = Number(localStorage.prestige)||0;

let miners = Number(localStorage.miners)||0;
let factories = Number(localStorage.factories)||0;

let minerCost = Number(localStorage.minerCost)||15;
let factoryCost = Number(localStorage.factoryCost)||100;
let upgradeCost = Number(localStorage.upgradeCost)||25;

let unlocked = JSON.parse(localStorage.unlocked || "[]");

function bonus(){
  return 1 + prestige*0.25;
}

function getGPS(){
  return (miners*1 + factories*10) * bonus();
}

function save(){
    localStorage.gold = gold;
    localStorage.totalGold = totalGold;
    localStorage.clickPower = clickPower;
    localStorage.prestige = prestige;
    localStorage.miners = miners;
    localStorage.factories = factories;
    localStorage.minerCost = minerCost;
    localStorage.factoryCost = factoryCost;
    localStorage.upgradeCost = upgradeCost;
    localStorage.unlocked = JSON.stringify(unlocked);
}

function update(){

    document.getElementById("gold").innerText=
    Math.floor(gold);

    document.getElementById("gps").innerText=
    getGPS().toFixed(1);

    document.getElementById("clickPower").innerText=
    clickPower;

    document.getElementById("prestigeLevel").innerText=
    prestige;

    document.getElementById("totalGold").innerText=
    Math.floor(totalGold);

    document.getElementById("minerCost").innerText=
    minerCost;

    document.getElementById("factoryCost").innerText=
    factoryCost;

    document.getElementById("upgradeCost").innerText=
    upgradeCost;

    checkAchievements();
    save();
}

function mine(e){

    let gain = clickPower * bonus();

    if(Math.random()<0.1){
        gain*=10;
        showFloating(
        "CRIT x10!",
        e.pageX,
        e.pageY
        );
    }

    gold+=gain;
    totalGold+=gain;

    showFloating(
    "+"+Math.floor(gain),
    e.pageX,
    e.pageY
    );

    update();
}

function showFloating(text,x,y){

    let div = document.createElement("div");

    div.className="floatText";
    div.innerText=text;

    div.style.left=x+"px";
    div.style.top=y+"px";

    document.body.appendChild(div);

    setTimeout(()=>{
      div.remove();
    },1000);
}

function buyMiner(){

    if(gold>=minerCost){

        gold-=minerCost;
        miners++;

        minerCost=
        Math.floor(minerCost*1.15);

        update();
    }
}

function buyFactory(){

    if(gold>=factoryCost){

        gold-=factoryCost;
        factories++;

        factoryCost=
        Math.floor(factoryCost*1.18);

        update();
    }
}

function upgradePickaxe(){

    if(gold>=upgradeCost){

        gold-=upgradeCost;

        clickPower++;

        upgradeCost=
        Math.floor(upgradeCost*2);

        update();
    }
}

function rebirth(){

    if(totalGold>=100000){

        prestige++;

        gold=0;
        miners=0;
        factories=0;
        clickPower=1;

        minerCost=15;
        factoryCost=100;
        upgradeCost=25;

        alert(
        "Prestige "+prestige+
        " unlocked!"
        );

        update();
    }
}

setInterval(()=>{

    let income = getGPS();

    gold += income;
    totalGold += income;

    update();

},1000);

const achievements = [
["First Gold",1],
["100 Gold",100],
["1,000 Gold",1000],
["10,000 Gold",10000],
["100,000 Gold",100000],
["Millionaire",1000000]
];

function checkAchievements(){

    const box =
    document.getElementById(
    "achievements"
    );

    box.innerHTML="";

    achievements.forEach(a=>{

        if(totalGold>=a[1]){

            if(!unlocked.includes(a[0]))
                unlocked.push(a[0]);

            let div=
            document.createElement("div");

            div.className=
            "achievement";

            div.innerText=
            "✅ "+a[0];

            box.appendChild(div);
        }
    });
}

function spawnNugget(){

    const nugget =
    document.getElementById(
    "goldenNugget"
    );

    nugget.style.display="block";

    nugget.style.left=
    Math.random()*80+"vw";

    nugget.style.top=
    Math.random()*80+"vh";

    nugget.onclick=()=>{

        let reward =
        getGPS()*100 + 100;

        gold+=reward;
        totalGold+=reward;

        alert(
        "Golden Nugget! +" +
        Math.floor(reward) +
        " Gold"
        );

        nugget.style.display="none";

        update();
    };

    setTimeout(()=>{
        nugget.style.display="none";
    },10000);
}

setInterval(()=>{

    if(Math.random()<0.35)
    spawnNugget();

},30000);

update();

</script>

</body>
</html>
